  <div class="pe-wrap">
    <div class="pe-card">
      <div style="font-size:18px;font-weight:800;margin-bottom:4px;">소재 사전평가</div>
      <div class="pe-note">신규 제작 소재(이미지)를 업로드하면, 선택 타이틀의 누적 성과 패턴에 얼마나 부합하는지 집행 전에 예측·개선 가이드를 제시합니다. <b>방향성 참고용</b>이며 실제 성과는 집행으로 검증하세요.</div>
    </div>

    <div class="pe-card">
      <div class="pe-row">
        <div>
          <div class="pe-label">타이틀</div>
          <select id="peTitle" class="pe-select"></select>
        </div>
        <div style="flex:1;min-width:260px;">
          <div class="pe-label">소재 이미지 (배너/대표 프레임)</div>
          <div id="peDrop" class="pe-drop">클릭 또는 드래그하여 이미지 업로드 (PNG/JPG, 10MB 이하)</div>
          <input type="file" id="peFile" accept="image/*" style="display:none;">
          <div id="pePreviewWrap" style="margin-top:10px;display:none;"><img id="pePreview" class="pe-preview"></div>
        </div>
      </div>
      <div style="margin-top:14px;">
        <div class="pe-label">소재 컨셉·의도 (선택)</div>
        <textarea id="peConcept" rows="2" placeholder="의도한 후킹·USP·타겟 등 (선택)" style="width:100%;box-sizing:border-box;font-size:13px;padding:8px;border:1px solid #e5e7eb;border-radius:6px;font-family:inherit;"></textarea>
      </div>
      <div style="margin-top:14px;display:flex;align-items:center;gap:12px;">
        <button id="peRun" class="pe-btn" disabled>평가 실행</button>
        <span id="peStatus" class="pe-note"></span>
      </div>

    <div id="peResult"></div>
  </div>

  <script src="js/data-source.js"></script>
  <script src="js/gemini-api.js"></script>
  <script>
  /* ===== 태그 택소노미 · 패턴 · 등급 (Task 3) =====
     SYNC: pipeline/schemas.py Enum (StrengthSignal/WeaknessSignal/HookingStrategy/CoreUSP/VisualStyle/PerformanceHypothesis) */
  const TAG_TAXONOMY = {
    art_style: ['2D 일러스트','3D 셀셰이딩','2.5D 피규어 입체 화풍','도트·픽셀 레트로','시네마틱 실사 합성'],
    hooking_strategy: ['실패/분노 유도','캐릭터 외형 소구','압도적 보상','질문·선택 상황 제시','비주얼 임팩트','트렌드·인터넷 밈'],
    USP: ['혜택형(무료뽑기/보상)','전략·경쟁형(상성/조합)','감성 유대형(교감/서사)','편의성형(방치/빠른성장)','대세감(출시일/사전등록수)'],
    strengths: ['강한 비주얼 임팩트','다수 캐릭터 라인업','SD·귀여운 캐릭터 연출','단일 주인공 스포트라이트','캐릭터 액션·전투 연출','보상 약속 명확','호기심·궁금증 유발','단일 명료한 가치 제안','수치·수상 사회증명','감성 유대·스토리텔링','출시일·한정 강조','게임플레이 자체 매력','오디오 후킹(BGM/SFX/Voice)'],
    weaknesses: ['장르·게임성 불분명','정보 과적 (텍스트·UI 산만)','후킹 식상·평이','행동 유도 약함·부재','모바일 가독성 떨어지는 텍스트','타이틀·브랜드 인지 약함','초반 3초 안에 가치 전달 실패'],
    hypothesis: ['높은 CTR 예상—강한 후킹','높은 CVR 예상—명확한 가치','낮은 관련성 위험—정보 부족','낮은 전환 위험—행동 유도 약함','특정 타겟에 강하게 반응','범용 어필(Mass-market)','피로도 빠를 위험—변주 필요'],
  };
  const NEGATIVE_HYPOTHESES = ['낮은 관련성 위험—정보 부족','낮은 전환 위험—행동 유도 약함','피로도 빠를 위험—변주 필요'];

  // 저장값·스키마 라벨의 구분자 차이(/··() 공백)를 흡수해 매칭.
  function normTag(s) { return String(s == null ? '' : s).replace(/[\s·・/()（）\[\]]/g, ''); }
  function _hasTag(list, tag) { const n = normTag(tag); return (list || []).some(x => normTag(x) === n); }

  // 타이틀 소재 → 우수/리스크 태그. 소재 4개 미만이면 insufficient.
  function computeTitlePattern(creatives) {
    const valid = (creatives || []).filter(c => c && c.scores && c.scores.total != null);
    const n = valid.length;
    if (n < 4) return { n, winnerTags: [], riskTags: [], insufficient: true };
    const sorted = valid.slice().sort((a, b) => b.scores.total - a.scores.total);
    const half = Math.floor(n / 2);
    const winners = sorted.slice(0, half), losers = sorted.slice(n - half);
    const rate = (cohort, tag) => cohort.filter(c => _hasTag(c.strengths, tag)).length / (cohort.length || 1);
    const allStrengths = [...new Set(valid.flatMap(c => c.strengths || []))];
    const winnerTags = allStrengths
      .map(tag => ({ tag, lift: +(rate(winners, tag) - rate(losers, tag)).toFixed(2) }))
      .filter(o => o.lift >= 0.2).sort((a, b) => b.lift - a.lift).map(o => o.tag);
    const wCount = {};
    losers.forEach(c => (c.weaknesses || []).forEach(w => { wCount[w] = (wCount[w] || 0) + 1; }));
    const thr = Math.ceil(losers.length / 3);
    const riskTags = Object.keys(wCount).filter(w => wCount[w] >= thr);
    return { n, winnerTags, riskTags, insufficient: false };
  }

  // 신규 소재 태그 × 타이틀 패턴 → 정성 등급 (결정론적).
  function gradeCreative(tags, pattern) {
    const s = tags.strengths || [], w = tags.weaknesses || [];
    const matchedWinners = (pattern.winnerTags || []).filter(t => _hasTag(s, t));
    const missedWinners  = (pattern.winnerTags || []).filter(t => !_hasTag(s, t));
    const heldRisks      = (pattern.riskTags || []).filter(t => _hasTag(w, t));
    let grade;
    if (matchedWinners.length >= 2 && heldRisks.length === 0) grade = '유망';
    else if (heldRisks.length >= 2 || (heldRisks.length >= 1 && matchedWinners.length === 0)) grade = '개선필요';
    else grade = '보통';
    return { grade, matchedWinners, missedWinners, heldRisks };
  }

  /* ===== 입력 UI (Task 2) ===== */
  window.__preEvalImage = null;   // { mimeType, data(base64) }

  async function _peInitTitles() {
    const sel = document.getElementById('peTitle');
    try {
      const titles = (window.DataSource && await window.DataSource.loadTitleManifest()) || [];
      const withData = titles.filter(t => t.json_url);
      sel.innerHTML = withData.map(t => `<option value="${t.id}">${t.name || t.id}</option>`).join('');
    } catch (_) { sel.innerHTML = '<option value="">타이틀 로드 실패</option>'; }
  }

  function _peUpdateRunState() {
    document.getElementById('peRun').disabled = !(window.__preEvalImage && document.getElementById('peTitle').value);
  }

  function _peHandleFile(file) {
    const status = document.getElementById('peStatus');
    if (!file) return;
    if (!/^image\//.test(file.type)) { status.textContent = '이미지 파일만 업로드할 수 있습니다.'; return; }
    if (file.size > 10 * 1024 * 1024) { status.textContent = '이미지가 10MB를 초과합니다.'; return; }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result);
      const base64 = dataUrl.split(',')[1] || '';
      window.__preEvalImage = { mimeType: file.type, data: base64 };
      document.getElementById('pePreview').src = dataUrl;
      document.getElementById('pePreviewWrap').style.display = 'block';
      status.textContent = '';
      _peUpdateRunState();
    };
    reader.readAsDataURL(file);
  }

  function _peWireInputs() {
    const drop = document.getElementById('peDrop'), file = document.getElementById('peFile');
    drop.addEventListener('click', () => file.click());
    file.addEventListener('change', e => _peHandleFile(e.target.files[0]));
    ['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
    ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
    drop.addEventListener('drop', e => _peHandleFile(e.dataTransfer.files[0]));
    document.getElementById('peTitle').addEventListener('change', _peUpdateRunState);
    document.getElementById('peRun').addEventListener('click', () => { if (typeof runPreEval === 'function') runPreEval(); });
  }

  /* ===== 오케스트레이션 · 프롬프트 · 렌더 (Task 4) ===== */
  function buildVisionPrompt(pattern, gameCtx, concept) {
    const T = TAG_TAXONOMY;
    const list = a => a.join(' / ');
    const L = [];
    L.push('당신은 모바일 게임 UA 소재 분석가입니다. 첨부 이미지를 분석해 아래 고정 택소노미의 정확한 한글 라벨로만 태깅하고, JSON으로만 응답하세요(다른 텍스트 금지).');
    L.push(`[택소노미] art_style(1개): ${list(T.art_style)} // hooking_strategy(1개): ${list(T.hooking_strategy)} // USP(1개): ${list(T.USP)} // strengths(1~3개): ${list(T.strengths)} // weaknesses(0~3개): ${list(T.weaknesses)} // hypothesis(1~2개): ${list(T.hypothesis)}`);
    if (gameCtx) L.push(`[게임 컨텍스트] ${gameCtx}`);
    if (pattern && !pattern.insufficient) {
      L.push(`[이 타이틀 우수 소재 공통 강점] ${pattern.winnerTags.join(', ') || '없음'}`);
      L.push(`[이 타이틀 저효율 공통 약점] ${pattern.riskTags.join(', ') || '없음'}`);
    }
    if (concept) L.push(`[마케터가 의도한 컨셉] ${concept}`);
    L.push('종합인사이트: 이 소재의 시각 신호를 위 패턴과 대조해 2~3문장. 개선가이드: 놓친 우수 요소 보완·리스크 제거 구체책 2~3개(개조식). 근거 없는 과장 금지.');
    L.push('출력 JSON 스키마: {"art_style":"","hooking_strategy":"","USP":"","strengths":[],"weaknesses":[],"hypothesis":[],"종합인사이트":"","개선가이드":[]}');
    return L.join('\n');
  }

  function parseVisionJson(raw) {
    if (!raw) return null;
    let s = String(raw).replace(/```json|```/g, '').trim();
    const a = s.indexOf('{'), b = s.lastIndexOf('}');
    if (a === -1 || b === -1) return null;
    try { return JSON.parse(s.slice(a, b + 1)); } catch (_) { return null; }
  }

  async function _peGameContext(titleId) {
    try {
      const res = await fetch(`pipeline/game_context/${titleId}.md`, { cache: 'no-store' });
      if (!res.ok) return '';
      return (await res.text()).slice(0, 1200);
    } catch (_) { return ''; }
  }

  window.runPreEval = async function runPreEval() {
    const status = document.getElementById('peStatus'), result = document.getElementById('peResult');
    const titleId = document.getElementById('peTitle').value;
    const img = window.__preEvalImage;
    if (!img) { status.textContent = '이미지를 먼저 업로드하세요.'; return; }
    if (typeof GeminiKeyManager === 'undefined' || !GeminiKeyManager.isSet()) {
      result.innerHTML = '<div class="pe-card">Gemini API 키가 설정되지 않았습니다. Step 1 화면에서 키를 설정한 뒤 이용하세요.</div>';
      return;
    }
    status.textContent = '분석 중… (수 초 소요)'; document.getElementById('peRun').disabled = true; result.innerHTML = '';
    try {
      const { normalized } = await window.DataSource.loadCreativeData('json-url', { url: `public/data/${titleId}.json`, titleId });
      const creatives = (normalized && normalized.rows) || [];
      const pattern = computeTitlePattern(creatives);
      const gameCtx = await _peGameContext(titleId);
      const concept = document.getElementById('peConcept').value.trim();
      const raw = await callGeminiVision(buildVisionPrompt(pattern, gameCtx, concept), img, { maxTokens: 1400, temperature: 0.4 });
      const parsed = parseVisionJson(raw);
      if (!parsed) { result.innerHTML = `<div class="pe-card"><b>AI 응답 파싱 실패</b><div class="pe-note" style="white-space:pre-wrap;margin-top:8px;">${_peEsc(raw).slice(0,1500)}</div></div>`; return; }
      const tags = { strengths: parsed.strengths || [], weaknesses: parsed.weaknesses || [] };
      const graded = pattern.insufficient ? null : gradeCreative(tags, pattern);
      renderPreEval({ titleId, pattern, parsed, graded });
    } catch (e) {
      const msg = (e && e.message) || String(e);
      result.innerHTML = `<div class="pe-card"><b>분석 실패</b><div class="pe-note" style="margin-top:6px;">${_peEsc(msg)}</div></div>`;
    } finally {
      status.textContent = ''; document.getElementById('peRun').disabled = false;
    }
  };

  function _peEsc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
  function _peBadges(arr, color) { return (arr || []).map(t => `<span style="display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;margin:2px 4px 2px 0;background:${color.bg};color:${color.tc};">${_peEsc(t)}</span>`).join('') || '<span class="pe-note">없음</span>'; }

  function renderPreEval({ titleId, pattern, parsed, graded }) {
    const gradeStyle = { '유망': {bar:'#16a34a',tint:'#f0fdf4',tc:'#15803d'}, '보통': {bar:'#9ca3af',tint:'#faf9f7',tc:'#374151'}, '개선필요': {bar:'#f59e0b',tint:'#fffbeb',tc:'#b45309'} };
    const card = (bar, tint, inner) => `<div class="pe-card" style="border-left:4px solid ${bar};background:${tint};">${inner}</div>`;
    let html = '';
    // 등급
    if (graded) {
      const st = gradeStyle[graded.grade] || gradeStyle['보통'];
      html += card(st.bar, st.tint,
        `<div style="font-size:13px;color:${st.tc};font-weight:700;">예측 등급</div>`
        + `<div style="font-size:24px;font-weight:800;color:${st.tc};margin:4px 0 10px;">${graded.grade}</div>`
        + `<div class="pe-label">✅ 보유한 우수 태그</div><div>${_peBadges(graded.matchedWinners, {bg:'#dcfce7',tc:'#15803d'})}</div>`
        + `<div class="pe-label" style="margin-top:8px;">⚠️ 놓친 우수 태그</div><div>${_peBadges(graded.missedWinners, {bg:'#f3f4f6',tc:'#374151'})}</div>`
        + `<div class="pe-label" style="margin-top:8px;">🚩 보유 리스크 태그</div><div>${_peBadges(graded.heldRisks, {bg:'#fee2e2',tc:'#b91c1c'})}</div>`);
    } else {
      html += card('#9ca3af', '#faf9f7', `<div style="font-weight:700;">비교 데이터 부족</div><div class="pe-note" style="margin-top:4px;">이 타이틀의 분석 소재가 4개 미만이라 등급은 생략합니다. 아래 감지 태그·AI 인사이트를 참고하세요.</div>`);
    }
    // 종합 인사이트
    if (parsed.종합인사이트) html += card('#3b82f6', '#eff6ff', `<div style="font-size:13px;color:#1d4ed8;font-weight:700;margin-bottom:6px;">종합 인사이트</div><div style="font-size:13px;color:#191919;line-height:1.6;">${_peEsc(parsed.종합인사이트)}</div>`);
    // 개선 가이드
    if (Array.isArray(parsed.개선가이드) && parsed.개선가이드.length) html += card('#f59e0b', '#fffbeb', `<div style="font-size:13px;color:#b45309;font-weight:700;margin-bottom:6px;">개선 가이드</div><ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.6;">${parsed.개선가이드.map(x => `<li>${_peEsc(x)}</li>`).join('')}</ul>`);
    // 감지 태그 요약
    html += card('#9ca3af', '#fff', `<div class="pe-label">감지된 태그 (참고)</div>`
      + `<div style="font-size:12.5px;color:#374151;line-height:1.8;">아트: <b>${_peEsc(parsed.art_style||'-')}</b> · 후킹: <b>${_peEsc(parsed.hooking_strategy||'-')}</b> · USP: <b>${_peEsc(parsed.USP||'-')}</b><br>강점: ${_peEsc((parsed.strengths||[]).join(', ')||'-')}<br>약점: ${_peEsc((parsed.weaknesses||[]).join(', ')||'-')}<br>예측: ${_peEsc((parsed.hypothesis||[]).join(', ')||'-')}</div>`);
    // 신뢰도 안내
    html += `<div class="pe-note">시각 신호 + ${_peEsc(titleId)} 소재 ${pattern.n}개 성과 패턴 기반 <b>방향성 참고</b>입니다. 실제 성과는 집행으로 검증하세요.</div>`;
    document.getElementById('peResult').innerHTML = html;
  }

  window.addEventListener('DOMContentLoaded', () => { _peInitTitles(); _peWireInputs(); });
  </script>
</body>
</html>
